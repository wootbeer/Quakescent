// Quakescent default settings and Descent-style keys.  FTE runs this
// instead of Quake's default.cfg; your own changes are saved over it.

unbindall

// Flying
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind space "+moveup"
bind c "+movedown"
bind ctrl "+movedown"
bind q "+qs_bankleft"
bind e "+qs_bankright"
bind z "qs_levelship"
bind leftarrow "+qs_left"
bind rightarrow "+qs_right"
bind uparrow "+qs_lookdown"
bind downarrow "+qs_lookup"

// Weapons
bind mouse1 "+attack"
bind mouse2 "+qs_fire2"
bind mouse3 "impulse 13"
bind mwheelup "impulse 12"
bind mwheeldown "impulse 13"
bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind 9 "impulse 9"
bind 0 "impulse 10"
bind f "+qs_flare"
bind b "+qs_bomb"
bind v "+qs_rearview"

// Quake's usual keys
bind escape "togglemenu"
bind ` "toggleconsole"
bind ~ "toggleconsole"
bind tab "+showscores"
bind t "messagemode"
bind pause "pause"
bind f1 "help"
bind f2 "menu_save"
bind f3 "menu_load"
bind f4 "menu_options"
bind f5 "menu_multiplayer"
bind f6 "echo Quicksaving...; wait; save quick"
bind f9 "echo Quickloading...; wait; load quick"
bind f10 "quit"
bind f12 "screenshot"

// The mouse turns the ship (the mod reads it directly).
seta sensitivity 3
seta m_pitch 0.022
seta m_yaw 0.022
seta cl_yawspeed 140
seta cl_pitchspeed 150

// The cockpit's message line shows the game's messages.
seta con_notifylines 0

// The default-size view; the cockpit covers the screen.
seta viewsize 100
seta crosshair 1
