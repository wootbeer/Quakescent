// Quakescent default settings and Descent-style keys.  FTE runs this
// instead of Quake's default.cfg; your own changes are saved over it.

exec qs_keys.cfg

// The mouse turns the ship (the mod reads it directly).
seta sensitivity 3
seta m_pitch 0.022
seta m_yaw 0.022
seta cl_yawspeed 140
seta cl_pitchspeed 150

// The cockpit's message line shows the game's messages.
seta con_notifylines 0

// Quakescent's settings (also in the options menu, F7), saved with your
// config.
seta qs_cockpit 1
seta qs_aimmomentum 1
seta qs_levelturn 1
seta qs_autolevel 0
seta qs_bankturns 0
seta qs_shipbob 1
seta qs_thrust 1
seta qs_damage 1
seta qs_damagetaken 1
seta qs_ickmode 0

// The default-size view; the cockpit covers the screen.
seta viewsize 100
seta crosshair 1
